safe: true
exclude:
  - README.md
  - Gemfile*
  - docker.sh
  - .gitattributes
  - .gitignore

# Blog specific settings
paginate_path: "posts/page/:num"
paginate: 5

# General settings
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      categories: [posts] # this is a slight hack so Jekyll generates the blog posts in /posts

highlighter: rouge
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

## The application virtual path
baseurl:
siteversion: 2025.07.08
title: Majorsilence
description: Peter Gill — software developer and open source author. Creator of Majorsilence Reporting, Majorsilence PDF, and other .NET and DevOps tools.

plugins: [jekyll-paginate, jekyll-redirect-from, jekyll-sitemap]
